<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>최은뽀 | Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        background: #fffdf2;

        color: #29281f;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;

    }


    button,
    input {

        font-family: inherit;

    }


    .page {

        width: min(
            1000px,
            calc(100% - 40px)
        );

        margin: 0 auto;

        padding: 55px 0 100px;

    }


    /* =========================
       LOGIN
    ========================== */

    #loginScreen {

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 25px;

    }


    .login-box {

        width: min(
            400px,
            100%
        );

        padding: 35px;

        border: 1px solid #ebe7cf;

        border-radius: 22px;

        background: #ffffff;

        box-shadow:
            0 20px 50px
            rgba(80, 70, 20, 0.08);

    }


    .login-eyebrow {

        margin-bottom: 8px;

        color: #aaa27a;

        font-size: 10px;

        font-weight: 900;

        letter-spacing: 2px;

    }


    .login-title {

        margin: 0;

        font-size: 30px;

        letter-spacing: -1.5px;

    }


    .login-description {

        margin: 10px 0 25px;

        color: #99947e;

        font-size: 12px;

        line-height: 1.7;

    }


    .input-group {

        margin-bottom: 13px;

    }


    .input-label {

        display: block;

        margin-bottom: 6px;

        color: #77704f;

        font-size: 10px;

        font-weight: 800;

    }


    input {

        width: 100%;

        padding: 13px 14px;

        border: 1px solid #e5dfc1;

        border-radius: 11px;

        outline: none;

        background: #fffefa;

        color: #29281f;

        font-size: 13px;

    }


    input:focus {

        border-color: #d5c54e;

    }


    .login-button {

        width: 100%;

        margin-top: 8px;

        padding: 13px;

        border: 0;

        border-radius: 11px;

        background: #e8d22d;

        color: #494317;

        cursor: pointer;

        font-size: 12px;

        font-weight: 900;

    }


    .login-button:hover {

        background: #dfc926;

    }


    .login-error {

        min-height: 18px;

        margin-top: 12px;

        color: #c15d45;

        text-align: center;

        font-size: 11px;

        font-weight: 700;

    }


    /* =========================
       HEADER
    ========================== */

    .admin-header {

        display: flex;

        align-items: flex-end;

        justify-content: space-between;

        gap: 20px;

        margin-bottom: 30px;

    }


    .back {

        display: inline-block;

        margin-bottom: 18px;

        color: #99926f;

        text-decoration: none;

        font-size: 11px;

        font-weight: 700;

    }


    .eyebrow {

        margin-bottom: 8px;

        color: #aaa27a;

        font-size: 10px;

        font-weight: 900;

        letter-spacing: 2px;

    }


    h1 {

        margin: 0;

        font-size: 38px;

        letter-spacing: -2px;

    }


    .logout-button {

        padding: 9px 13px;

        border: 1px solid #e4dfc4;

        border-radius: 10px;

        background: #ffffff;

        color: #77704f;

        cursor: pointer;

        font-size: 10px;

        font-weight: 800;

    }


    .logout-button:hover {

        background: #fffbea;

    }


    /* =========================
       LAYOUT
    ========================== */

    .admin-grid {

        display: grid;

        grid-template-columns:
            minmax(0, 1.5fr)
            minmax(300px, 0.8fr);

        gap: 20px;

    }


    .panel {

        padding: 24px;

        border: 1px solid #ebe7cf;

        border-radius: 20px;

        background: #ffffff;

    }


    /* =========================
       CALENDAR
    ========================== */

    .calendar-header {

        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 22px;

    }


    .month-title {

        font-size: 20px;

        font-weight: 900;

        letter-spacing: -1px;

    }


    .month-buttons {

        display: flex;

        gap: 6px;

    }


    .month-button {

        width: 34px;

        height: 34px;

        border: 1px solid #e4dfc4;

        border-radius: 9px;

        background: #fffdf2;

        color: #77704f;

        cursor: pointer;

        font-size: 14px;

        font-weight: 900;

    }


    .month-button:hover {

        background: #f8f2c9;

    }


    .weekdays {

        display: grid;

        grid-template-columns:
            repeat(7, 1fr);

        margin-bottom: 6px;

    }


    .weekday {

        padding: 7px 0;

        color: #aaa27a;

        text-align: center;

        font-size: 9px;

        font-weight: 800;

    }


    .calendar-grid {

        display: grid;

        grid-template-columns:
            repeat(7, 1fr);

        gap: 5px;

    }


    .calendar-day {

        position: relative;

        min-height: 72px;

        padding: 7px;

        border: 1px solid transparent;

        border-radius: 10px;

        background: #fffefa;

        cursor: pointer;

    }


    .calendar-day:hover {

        border-color: #e6deac;

        background: #fffced;

    }


    .calendar-day.empty {

        background: transparent;

        cursor: default;

    }


    .calendar-day.empty:hover {

        border-color: transparent;

        background: transparent;

    }


    .calendar-day.selected {

        border-color: #d6c448;

        background: #fffbea;

    }


    .day-number {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        width: 25px;

        height: 25px;

        border-radius: 50%;

        font-size: 10px;

        font-weight: 800;

    }


    .calendar-day.today
    .day-number {

        background: #f1d52e;

        color: #4c461d;

    }


    .calendar-day.selected
    .day-number {

        background: #e8d02c;

        color: #403b18;

    }


    .schedule-dot {

        position: absolute;

        bottom: 7px;

        left: 50%;

        width: 5px;

        height: 5px;

        border-radius: 50%;

        background: #d1b91f;

        transform:
            translateX(-50%);

    }


    .schedule-count {

        position: absolute;

        top: 7px;

        right: 7px;

        color: #aaa27a;

        font-size: 8px;

        font-weight: 900;

    }


    /* =========================
       FORM
    ========================== */

    .panel-title {

        margin: 0 0 5px;

        font-size: 18px;

        font-weight: 900;

    }


    .panel-description {

        margin: 0 0 22px;

        color: #99947e;

        font-size: 11px;

    }


    .selected-date {

        margin-bottom: 20px;

        padding: 11px 13px;

        border-radius: 10px;

        background: #f8f4d9;

        color: #817947;

        font-size: 11px;

        font-weight: 900;

    }


    .form-group {

        margin-bottom: 14px;

    }


    .form-label {

        display: block;

        margin-bottom: 6px;

        color: #77704f;

        font-size: 10px;

        font-weight: 800;

    }


    .save-button {

        width: 100%;

        padding: 13px;

        border: 0;

        border-radius: 10px;

        background: #e8d02c;

        color: #494317;

        cursor: pointer;

        font-size: 11px;

        font-weight: 900;

    }


    .save-button:hover {

        background: #dfc926;

    }


    .cancel-button {

        display: none;

        width: 100%;

        margin-top: 7px;

        padding: 11px;

        border: 1px solid #e4dfc4;

        border-radius: 10px;

        background: #ffffff;

        color: #77704f;

        cursor: pointer;

        font-size: 10px;

        font-weight: 800;

    }


    .cancel-button.visible {

        display: block;

    }


    .form-message {

        min-height: 18px;

        margin-top: 10px;

        text-align: center;

        font-size: 10px;

        font-weight: 800;

    }


    .form-message.success {

        color: #7b8743;

    }


    .form-message.error {

        color: #c15d45;

    }


    /* =========================
       SCHEDULE LIST
    ========================== */

    .schedule-list {

        display: flex;

        flex-direction: column;

        gap: 9px;

        margin-top: 22px;

    }


    .schedule-item {

        padding: 13px;

        border: 1px solid #ebe7cf;

        border-radius: 12px;

        background: #fffefa;

    }


    .schedule-item-top {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

    }


    .schedule-time {

        color: #aaa27a;

        font-size: 10px;

        font-weight: 900;

    }


    .schedule-title {

        margin-top: 4px;

        color: #29281f;

        font-size: 12px;

        font-weight: 900;

    }


    .schedule-platform {

        display: inline-block;

        margin-top: 7px;

        padding: 3px 7px;

        border-radius: 6px;

        background: #f8f4d9;

        color: #817947;

        font-size: 8px;

        font-weight: 800;

    }


    .schedule-actions {

        display: flex;

        gap: 5px;

    }


    .action-button {

        padding: 5px 8px;

        border: 1px solid #e4dfc4;

        border-radius: 7px;

        background: #ffffff;

        color: #77704f;

        cursor: pointer;

        font-size: 8px;

        font-weight: 800;

    }


    .action-button:hover {

        background: #fffbea;

    }


    .action-button.delete {

        color: #b75c4b;

    }


    .no-schedule {

        margin-top: 18px;

        padding: 25px 10px;

        border: 1px dashed #dcd6ae;

        border-radius: 12px;

        color: #99926f;

        text-align: center;

        font-size: 10px;

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 760px) {

        .page {

            width: calc(100% - 30px);

            padding-top: 35px;

        }


        .admin-header {

            align-items: flex-start;

            flex-direction: column;

        }


        .admin-grid {

            grid-template-columns: 1fr;

        }


        .calendar-day {

            min-height: 55px;

        }

    }


    @media (max-width: 480px) {

        .calendar-grid {

            gap: 2px;

        }


        .calendar-day {

            min-height: 48px;

            padding: 4px;

        }


        .day-number {

            width: 22px;

            height: 22px;

        }


        .schedule-count {

            top: 4px;

            right: 4px;

        }


        .schedule-dot {

            bottom: 5px;

        }


        .panel {

            padding: 17px;

        }

    }

</style>

</head>

<body>

<!-- =====================================================
     LOGIN
====================================================== -->

<div
    id="loginScreen"
>

<div class="login-box">


    <div class="login-eyebrow">
        EUNPPO ADMIN
    </div>


    <h1 class="login-title">
        관리자 로그인
    </h1>


    <p class="login-description">

        최은뽀 방송 일정 관리 페이지입니다.<br>

        관리자 계정으로 로그인해주세요.

    </p>


    <form
        id="loginForm"
    >


        <div class="input-group">

            <label class="input-label">
                이메일
            </label>

            <input
                id="email"
                type="email"
                placeholder="관리자 이메일"
                required
            >

        </div>


        <div class="input-group">

            <label class="input-label">
                비밀번호
            </label>

            <input
                id="password"
                type="password"
                placeholder="비밀번호"
                required
            >

        </div>


        <button
            class="login-button"
            type="submit"
        >
            로그인
        </button>


        <div
            id="loginError"
            class="login-error"
        ></div>


    </form>


</div>

</div>

<!-- =====================================================
     ADMIN
====================================================== -->

<div
    id="adminScreen"
    style="display:none;"
>

<main class="page">


    <a
        href="index.html"
        class="back"
    >
        ← PROFILE
    </a>


    <header class="admin-header">


        <div>

            <div class="eyebrow">
                EUNPPO ADMIN
            </div>


            <h1>
                방송 일정 관리
            </h1>

        </div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            로그아웃
        </button>


    </header>



    <div class="admin-grid">


        <!-- =========================
             CALENDAR
        ========================== -->

        <section class="panel">


            <div class="calendar-header">


                <div
                    id="monthTitle"
                    class="month-title"
                >
                    2026년 8월
                </div>


                <div class="month-buttons">


                    <button
                        id="prevMonth"
                        class="month-button"
                        type="button"
                    >
                        ‹
                    </button>


                    <button
                        id="nextMonth"
                        class="month-button"
                        type="button"
                    >
                        ›
                    </button>


                </div>


            </div>



            <div class="weekdays">

                <div class="weekday">
                    일
                </div>

                <div class="weekday">
                    월
                </div>

                <div class="weekday">
                    화
                </div>

                <div class="weekday">
                    수
                </div>

                <div class="weekday">
                    목
                </div>

                <div class="weekday">
                    금
                </div>

                <div class="weekday">
                    토
                </div>

            </div>



            <div
                id="calendarGrid"
                class="calendar-grid"
            ></div>


        </section>



        <!-- =========================
             FORM
        ========================== -->

        <section class="panel">


            <h2
                id="formTitle"
                class="panel-title"
            >
                일정 추가
            </h2>


            <p class="panel-description">
                날짜를 선택한 후 방송 일정을 등록하세요.
            </p>


            <div
                id="selectedDate"
                class="selected-date"
            >
                날짜를 선택해주세요.
            </div>



            <form
                id="scheduleForm"
            >


                <div class="form-group">

                    <label
                        class="form-label"
                        for="scheduleTime"
                    >
                        방송 시간
                    </label>


                    <input
                        id="scheduleTime"
                        type="time"
                        required
                    >

                </div>



                <div class="form-group">

                    <label
                        class="form-label"
                        for="scheduleTitle"
                    >
                        방송 내용
                    </label>


                    <input
                        id="scheduleTitle"
                        type="text"
                        placeholder="예: 공포게임 방송"
                        maxlength="100"
                        required
                    >

                </div>



                <div class="form-group">

                    <label class="form-label">
                        방송 플랫폼
                    </label>


                    <input
                        type="text"
                        value="SOOP"
                        disabled
                    >

                </div>



                <button
                    id="saveButton"
                    class="save-button"
                    type="submit"
                >
                    일정 등록
                </button>


                <button
                    id="cancelButton"
                    class="cancel-button"
                    type="button"
                >
                    수정 취소
                </button>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>


            </form>



            <!-- 선택 날짜 일정 -->

            <div
                id="selectedSchedules"
                class="schedule-list"
            ></div>


        </section>


    </div>


</main>

</div>

<script>


/* =====================================================
   SUPABASE
====================================================== */

const SUPABASE_URL =
    "https://hqghdlkgaiqddbrtplph.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_PhEaJGuC_SByKrfPhSw2Ng_PC9Vz2Cc";


const {
    createClient
} = supabase;


const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   STATE
====================================================== */

let schedules = [];

let currentDate =
    new Date();

let selectedDate = null;

let editingId = null;


/* =====================================================
   ELEMENTS
====================================================== */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const adminScreen =
    document.getElementById(
        "adminScreen"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const monthTitle =
    document.getElementById(
        "monthTitle"
    );


const calendarGrid =
    document.getElementById(
        "calendarGrid"
    );


const selectedDateElement =
    document.getElementById(
        "selectedDate"
    );


const selectedSchedules =
    document.getElementById(
        "selectedSchedules"
    );


const scheduleForm =
    document.getElementById(
        "scheduleForm"
    );


const scheduleTime =
    document.getElementById(
        "scheduleTime"
    );


const scheduleTitle =
    document.getElementById(
        "scheduleTitle"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const formTitle =
    document.getElementById(
        "formTitle"
    );


const formMessage =
    document.getElementById(
        "formMessage"
    );


/* =====================================================
   LOGIN
====================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        loginError.textContent =
            "";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const {
            data,
            error
        } = await db.auth.signInWithPassword({

            email:
                email,

            password:
                password

        });


        if (error) {

            console.error(error);


            loginError.textContent =
                "이메일 또는 비밀번호를 확인해주세요.";

            return;

        }


        /*
         * 로그인 후 관리자 권한 확인
         */

        const user =
            data.user;


        if (!user) {

            loginError.textContent =
                "로그인에 실패했습니다.";

            return;

        }


        await checkAdmin(
            user
        );

    }
);


/* =====================================================
   ADMIN CHECK
====================================================== */

async function checkAdmin(
    user
) {

    /*
     * Supabase Auth의 user metadata에
     * admin=true가 있는 경우 관리자
     */


    const isAdmin =
        user.user_metadata &&
        user.user_metadata.admin === true;


    if (!isAdmin) {

        await db.auth.signOut();


        loginError.textContent =
            "관리자 권한이 없는 계정입니다.";

        return;

    }


    showAdmin();


}


/* =====================================================
   SHOW ADMIN
====================================================== */

function showAdmin() {

    loginScreen.style.display =
        "none";


    adminScreen.style.display =
        "block";


    loadSchedules();

}


/* =====================================================
   SESSION CHECK
====================================================== */

async function checkSession() {

    const {
        data
    } = await db.auth.getSession();


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        await checkAdmin(
            data.session.user
        );

    }

}


/* =====================================================
   LOGOUT
====================================================== */

logoutButton.addEventListener(
    "click",
    async function() {

        await db.auth.signOut();

        location.reload();

    }
);


/* =====================================================
   LOAD
====================================================== */

async function loadSchedules() {

    const {
        data,
        error
    } = await db

        .from("eunppo")

        .select(
            "id, date, time, title, platform"
        )

        .order(
            "date",
            {
                ascending: true
            }
        )

        .order(
            "time",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            error
        );

        alert(
            "일정을 불러오지 못했습니다."
        );

        return;

    }


    schedules =
        data || [];


    renderCalendar();


    if (selectedDate) {

        renderSelectedSchedules();

    }

}


/* =====================================================
   CALENDAR
====================================================== */

function renderCalendar() {

    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    monthTitle.textContent =
        `${year}년 ${month + 1}월`;


    calendarGrid.innerHTML =
        "";


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "calendar-day empty";


        calendarGrid.appendChild(
            empty
        );

    }


    for (
        let day = 1;
        day <= lastDate;
        day++
    ) {

        const dateString =
            `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


        const dayElement =
            document.createElement(
                "div"
            );


        dayElement.className =
            "calendar-day";


        if (
            dateString ===
            formatDate(
                new Date()
            )
        ) {

            dayElement
                .classList
                .add(
                    "today"
                );

        }


        if (
            dateString ===
            selectedDate
        ) {

            dayElement
                .classList
                .add(
                    "selected"
                );

        }


        const daySchedules =
            schedules.filter(
                schedule =>
                    schedule.date ===
                    dateString
            );


        dayElement.innerHTML = `

            <span class="day-number">
                ${day}
            </span>

        `;


        if (
            daySchedules.length > 0
        ) {

            dayElement.innerHTML += `

                <span class="schedule-dot"></span>

            `;


            if (
                daySchedules.length > 1
            ) {

                dayElement.innerHTML += `

                    <span class="schedule-count">
                        ${daySchedules.length}
                    </span>

                `;

            }

        }


        dayElement.addEventListener(
            "click",
            function() {

                selectDate(
                    dateString
                );

            }
        );


        calendarGrid.appendChild(
            dayElement
        );

    }

}


/* =====================================================
   SELECT DATE
====================================================== */

function selectDate(
    dateString
) {

    selectedDate =
        dateString;


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    selectedDateElement.textContent =
        `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;


    resetForm();


    renderCalendar();


    renderSelectedSchedules();

}


/* =====================================================
   SELECTED SCHEDULES
====================================================== */

function renderSelectedSchedules() {

    const selected =
        schedules.filter(
            schedule =>
                schedule.date ===
                selectedDate
        );


    selectedSchedules.innerHTML =
        "";


    if (
        selected.length === 0
    ) {

        selectedSchedules.innerHTML = `

            <div class="no-schedule">

                등록된 일정이 없습니다.

            </div>

        `;

        return;

    }


    selectedSchedules.innerHTML =
        selected
            .map(
                schedule =>
                    createScheduleItem(
                        schedule
                    )
            )
            .join("");


    selected.forEach(
        schedule => {

            document
                .getElementById(
                    `edit-${schedule.id}`
                )
                .addEventListener(
                    "click",
                    function() {

                        startEdit(
                            schedule
                        );

                    }
                );


            document
                .getElementById(
                    `delete-${schedule.id}`
                )
                .addEventListener(
                    "click",
                    function() {

                        deleteSchedule(
                            schedule.id
                        );

                    }
                );

        }
    );

}


/* =====================================================
   SCHEDULE ITEM
====================================================== */

function createScheduleItem(
    schedule
) {

    return `

        <div class="schedule-item">


            <div class="schedule-item-top">

                <span class="schedule-time">

                    ${escapeHtml(
                        schedule.time || ""
                    )}

                </span>


                <div class="schedule-actions">

                    <button
                        id="edit-${schedule.id}"
                        class="action-button"
                        type="button"
                    >
                        수정
                    </button>


                    <button
                        id="delete-${schedule.id}"
                        class="action-button delete"
                        type="button"
                    >
                        삭제
                    </button>

                </div>

            </div>


            <div class="schedule-title">

                ${escapeHtml(
                    schedule.title ||
                    "방송"
                )}

            </div>


            <span class="schedule-platform">

                SOOP

            </span>


        </div>

    `;

}


/* =====================================================
   ADD / UPDATE
====================================================== */

scheduleForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!selectedDate) {

            showFormMessage(
                "먼저 날짜를 선택해주세요.",
                "error"
            );

            return;

        }


        const time =
            scheduleTime.value;


        const title =
            scheduleTitle.value.trim();


        if (!time || !title) {

            showFormMessage(
                "방송 시간과 내용을 입력해주세요.",
                "error"
            );

            return;

        }


        saveButton.disabled =
            true;


        saveButton.textContent =
            "저장 중...";


        let result;


        if (editingId) {


            /*
             * 수정
             */

            result =
                await db

                    .from("eunppo")

                    .update({

                        date:
                            selectedDate,

                        time:
                            time,

                        title:
                            title,

                        platform:
                            "SOOP"

                    })

                    .eq(
                        "id",
                        editingId
                    );


        } else {


            /*
             * 신규 등록
             */

            result =
                await db

                    .from("eunppo")

                    .insert({

                        date:
                            selectedDate,

                        time:
                            time,

                        title:
                            title,

                        platform:
                            "SOOP"

                    });

        }


        saveButton.disabled =
            false;


        saveButton.textContent =
            editingId
                ? "일정 수정"
                : "일정 등록";


        if (
            result.error
        ) {

            console.error(
                result.error
            );


            showFormMessage(
                "저장하지 못했습니다.",
                "error"
            );

            return;

        }


        showFormMessage(
            editingId
                ? "일정을 수정했습니다."
                : "일정을 등록했습니다.",
            "success"
        );


        resetForm();


        await loadSchedules();

    }
);


/* =====================================================
   EDIT
====================================================== */

function startEdit(
    schedule
) {

    editingId =
        schedule.id;


    selectedDate =
        schedule.date;


    const date =
        new Date(
            schedule.date +
            "T00:00:00"
        );


    selectedDateElement.textContent =
        `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;


    scheduleTime.value =
        schedule.time || "";


    scheduleTitle.value =
        schedule.title || "";


    formTitle.textContent =
        "일정 수정";


    saveButton.textContent =
        "일정 수정";


    cancelButton.classList.add(
        "visible"
    );


    formMessage.textContent =
        "";


    renderCalendar();

}


/* =====================================================
   CANCEL EDIT
====================================================== */

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);


/* =====================================================
   RESET FORM
====================================================== */

function resetForm() {

    editingId =
        null;


    scheduleForm.reset();


    formTitle.textContent =
        "일정 추가";


    saveButton.textContent =
        "일정 등록";


    cancelButton.classList.remove(
        "visible"
    );


    formMessage.textContent =
        "";


    /*
     * SOOP은 disabled input이라
     * reset해도 문제 없음
     */

}


/* =====================================================
   DELETE
====================================================== */

async function deleteSchedule(
    id
) {

    const confirmed =
        confirm(
            "이 방송 일정을 삭제할까요?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } = await db

        .from("eunppo")

        .delete()

        .eq(
            "id",
            id
        );


    if (error) {

        console.error(
            error
        );


        alert(
            "일정을 삭제하지 못했습니다."
        );

        return;

    }


    if (
        editingId === id
    ) {

        resetForm();

    }


    await loadSchedules();

}


/* =====================================================
   MONTH MOVE
====================================================== */

document
    .getElementById(
        "prevMonth"
    )
    .addEventListener(
        "click",
        function() {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );


            renderCalendar();

        }
    );


document
    .getElementById(
        "nextMonth"
    )
    .addEventListener(
        "click",
        function() {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );


            renderCalendar();

        }
    );


/* =====================================================
   FORM MESSAGE
====================================================== */

function showFormMessage(
    message,
    type
) {

    formMessage.textContent =
        message;


    formMessage.className =
        `form-message ${type}`;

}


/* =====================================================
   DATE
====================================================== */

function formatDate(
    date
) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


/* =====================================================
   ESCAPE
====================================================== */

function escapeHtml(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START
====================================================== */

checkSession();


</script>
